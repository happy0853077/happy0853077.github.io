<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>明日方舟：终末地 物资模板计算器</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: #334155;
      --accent: #60a5fa;
      --good: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #0b1220, #0f172a 30%, #111827 100%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 1300px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: .5px;
    }
    .sub {
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 18px;
    }
    .card {
      background: rgba(17,24,39,.9);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 14px 40px rgba(0,0,0,.24);
      margin-bottom: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
    }
    .day {
      background: #0b1220;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
    }
    .day label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .day input {
      width: 100%;
      border: 1px solid #475569;
      background: #111827;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
      font-size: 16px;
    }
    .day input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(96,165,250,.15);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      align-items: center;
    }
    button {
      border: 0;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      color: white;
      padding: 11px 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }
    button.secondary {
      background: #1f2937;
      border: 1px solid #374151;
      color: var(--text);
    }
    button:hover { filter: brightness(1.05); }
    .hint {
      color: var(--muted);
      font-size: 13px;
    }
    .formula {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      margin-top: 10px;
    }
    .formula .box {
      background: #0b1220;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      color: var(--text);
      line-height: 1.7;
      font-size: 14px;
    }
    .table-wrap {
      overflow-x: auto;
      margin-top: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
      background: #0b1220;
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      border-bottom: 1px solid #243244;
      padding: 10px 12px;
      text-align: center;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      background: #111827;
      color: #cbd5e1;
      font-weight: 700;
      z-index: 1;
    }
    tbody tr:hover td {
      background: rgba(96,165,250,.06);
    }
    details {
      background: #0b1220;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(31,41,55,.95), rgba(17,24,39,.95));
      border-bottom: 1px solid #223042;
      font-weight: 700;
    }
    summary::-webkit-details-marker { display: none; }
    .section {
      padding: 0 16px 14px;
    }
    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      margin-left: 8px;
      vertical-align: middle;
      background: rgba(96,165,250,.15);
      color: #bfdbfe;
      border: 1px solid rgba(96,165,250,.3);
    }
    .ok {
      color: var(--good);
      font-weight: 700;
    }
    .muted { color: var(--muted); }
    .error {
      color: #fecaca;
      background: rgba(248,113,113,.12);
      border: 1px solid rgba(248,113,113,.35);
      padding: 10px 12px;
      border-radius: 12px;
      margin-top: 10px;
      display: none;
    }
    .empty {
      color: var(--muted);
      padding: 18px 0 4px;
    }
    .small {
      font-size: 12px;
      color: var(--muted);
    }
    .footer-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      margin-top: 8px;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>明日方舟：终末地 物资价格计算器</h1>
    <div class="sub">
      输入某个商品一周 1-7 天的价格后，页面会生成64组结果。
      你可以直接展开对应的模板下拉菜单，和新一周前 1-3 天的实际价格做对照。
    </div>

    <div class="card">
      <div class="grid" id="inputs"></div>
      <div class="actions">
        <button id="calcBtn">计算 64 组结果</button>
        <button class="secondary" id="fillDemoBtn" type="button">填入示例</button>
        
      </div>
      <div class="error" id="errorBox"></div>

      <div class="formula">
        <div class="box">
          <div><b>第 1 步</b></div>
          <div>按源模板计算每一天的相对化标准偏差：</div>
          <div><code>ε = (P - T) / (X × T)</code></div>
        </div>
        <div class="box">
          <div><b>第 2 步</b></div>
          <div>把这组 ε 套到目标模板，生成预测价格：</div>
          <div><code>P' = T × (1 + X × ε)</code></div>
        </div>
        <div class="box">
          <div><b>展示方式</b></div>
          <div>下方按“源模板 1-8”分组，每组里有 8 个目标模板结果。</div>
        </div>
      </div>
    </div>

    <div id="results"></div>

  </div>

<script>
const templates = [
  { no: 1, T: [1600, 2000, 2200, 2600, 3000, 3200, 3400], X: 5 },
  { no: 2, T: [2200, 2000, 1800, 1700, 1500, 1200, 1100], X: 5 },
  { no: 3, T: [2400, 2000, 1600, 1400, 1600, 2000, 2200], X: 5 },
  { no: 4, T: [1800, 2000, 2600, 3000, 3400, 2600, 2000], X: 5 },
  { no: 5, T: [2000, 1600, 2400, 1600, 2400, 1600, 2400], X: 4 },
  { no: 6, T: [2000, 2400, 1600, 2400, 1600, 2400, 1600], X: 4 },
  { no: 7, T: [2200, 1400, 3000, 1200, 3600, 1000, 4000], X: 6 },
  { no: 8, T: [2200, 3000, 1600, 3600, 1200, 4000, 1000], X: 6 },
];

const inputWrap = document.getElementById('inputs');
const resultsWrap = document.getElementById('results');
const errorBox = document.getElementById('errorBox');

function createInputs() {
  inputWrap.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const div = document.createElement('div');
    div.className = 'day';
    div.innerHTML = `
      <label>第 ${i + 1} 天价格</label>
      <input type="number" inputmode="decimal" step="any" min="0" id="day-${i}" placeholder="例如 2000" />
    `;
    inputWrap.appendChild(div);
  }
}

function getInputs() {
  const values = [];
  for (let i = 0; i < 7; i++) {
    const raw = document.getElementById(`day-${i}`).value.trim();
    const num = Number(raw);
    if (raw === '' || Number.isNaN(num) || !Number.isFinite(num)) {
      throw new Error(`第 ${i + 1} 天价格没有填好。`);
    }
    values.push(num);
  }
  return values;
}

function calcEpsilon(source, observed) {
  return observed.map((p, idx) => (p - source.T[idx]) / (source.X * source.T[idx]));
}

function calcPrediction(target, epsilon) {
  return target.T.map((t, idx) => t * (1 + target.X * epsilon[idx]));
}

function fmt(n) {
  if (!Number.isFinite(n)) return '-';
  const fixed = n.toFixed(2);
  return fixed.replace(/\.00$/, '');
}

function renderResults(observed) {
  const sections = [];
  templates.forEach((source) => {
    const epsilon = calcEpsilon(source, observed);
    const rows = templates.map((target) => {
      const predicted = calcPrediction(target, epsilon);
      const avgAbsDiff = predicted.reduce((sum, v, idx) => sum + Math.abs(v - observed[idx]), 0) / predicted.length;
      return { target, predicted, avgAbsDiff };
    }).sort((a, b) => a.avgAbsDiff - b.avgAbsDiff);

    const bestTargetNo = rows[0].target.no;
    const detailRows = rows.map((row) => `
      <tr>
        <td><b>${row.target.no}</b>${row.target.no === bestTargetNo ? ' <span class="tag">最接近</span>' : ''}</td>
        <td>${row.predicted.map(fmt).join(' / ')}</td>
        <td>${fmt(row.avgAbsDiff)}</td>
      </tr>
    `).join('');

    sections.push(`
      <details ${source.no === 1 ? 'open' : ''}>
        <summary>源模板 ${source.no} <span class="tag">X=${source.X}</span></summary>
        <div class="section">
          <div class="small">源模板的 T 值：${source.T.join(' / ')}</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width: 120px;">目标模板</th>
                  <th>预测的 1-7 天价格</th>
                  <th style="width: 160px;">与输入的平均差</th>
                </tr>
              </thead>
              <tbody>
                ${detailRows}
              </tbody>
            </table>
          </div>
        </div>
      </details>
    `);
  });

  resultsWrap.innerHTML = sections.join('');
}

function calculate() {
  errorBox.style.display = 'none';
  try {
    const observed = getInputs();
    renderResults(observed);
  } catch (err) {
    errorBox.textContent = err.message || '输入有误。';
    errorBox.style.display = 'block';
    resultsWrap.innerHTML = `<div class="card empty">先把 7 天价格填完整，再点“计算 64 组结果”。</div>`;
  }
}

function fillDemo() {
  const demo = [2100, 1900, 1800, 1700, 1600, 1500, 1400];
  demo.forEach((v, i) => {
    document.getElementById(`day-${i}`).value = v;
  });
}

document.getElementById('calcBtn').addEventListener('click', calculate);
document.getElementById('fillDemoBtn').addEventListener('click', fillDemo);

createInputs();
resultsWrap.innerHTML = `<div class="card empty">先把 7 天价格填完整，再点“计算 64 组结果”。</div>`;
</script>
</body>
</html>
